# Selected refinement methods ONLY; this file is provenance documentation.
# Current implementation can read/replay the final archived XYZ, but does not
# reproduce the missing original Joint 6-DoF / P2Plane-PGO optimizer code.
experiment: d1_selected_refiners_20261106
input:
  scenes: [D1]
  raw_scan_count: 10
  reference_scan_id: 5
  deskew: original_glim_per_return
refinement:
  methods:
    - Joint   # Joint 6-DoF scan pose optimization: historical output available
    - PGO     # Point-to-Plane PGO: historical output available
  original_solvers_available: false
  source_of_results: archived_Joint_xyz_and_PGO_xyz
  recovered_scan_poses: posthoc_kabsch_fit_from_known_xyz
  max_reference_replay_deviation_m: 2.0e-5
ghost_filter:
  enabled_by_default: false
  mode: target_scan_free_space
  azimuth_resolution_deg: 0.2
  elevation_resolution_deg: 2.0
  margin_m: 0.5