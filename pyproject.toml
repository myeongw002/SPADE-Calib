[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spade-calib"
version = "0.1.0"
description = "Research framework for targetless sparse-LiDAR camera extrinsic calibration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
research = [
    "scipy>=1.10,<2",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
